<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <title>Facebook Clone</title>
  </head>

  <body>
    <div class="nav-bar">
      <div class="nav-left">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Facebook_Logo_2023.png/1280px-Facebook_Logo_2023.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail"
          alt="facebook logo"
          class="logo"
        />
        <input type="text" placeholder="search " class="search" />
        <img
          src="https://cdn.pixabay.com/photo/2024/06/11/21/36/cherries-8824148_1280.jpg"
          alt=""
          class="nav-right-profile-img-mobile-show"
        />
      </div>
      <div class="nav-center">
        <span class="material-symbols-outlined"> home </span>
        <span class="material-symbols-outlined"> notifications </span>
        <span class="material-symbols-outlined">live_tv</span>

        <span class="material-symbols-outlined mobile-hide"> storefront </span>
        <span class="material-symbols-outlined mobile-hide"> group </span>
        <span class="material-symbols-outlined"> chat </span>
      </div>
      <div class="nav-right">
        <img
          src="https://cdn.pixabay.com/photo/2024/06/11/21/36/cherries-8824148_1280.jpg"
          alt=""
          class="nav-left-profile-img-desktop-show"
        />
        <span class="material-symbols-outlined"> settings</span>
      </div>
    </div>

    <div class="stroy-section">
      <div class="story-container">
        <div class="story">
          <img
            src="https://cdn.pixabay.com/photo/2022/12/10/11/05/snow-7646952_1280.jpg"
            alt=""
            class="story-img"
          />
          <img
            src="https://cdn.pixabay.com/photo/2024/06/11/21/36/cherries-8824148_1280.jpg"
            alt=""
            class="profile-img-story"
          />
          <span class="story-user-name"> your story</span>
        </div>
        <div class="story">
          <img
            src="https://cdn.pixabay.com/photo/2022/12/10/11/05/snow-7646952_1280.jpg"
            alt=""
            class="story-img"
          />
          <img
            src="https://cdn.pixabay.com/photo/2024/06/11/21/36/cherries-8824148_1280.jpg"
            alt=""
            class="profile-img-story"
          />
          <span class="story-user-name">friend-n</span>
        </div>
        <div class="story">
          <img
            src="https://cdn.pixabay.com/photo/2022/12/10/11/05/snow-7646952_1280.jpg"
            alt=""
            class="story-img"
          />
          <img
            src="https://cdn.pixabay.com/photo/2024/06/11/21/36/cherries-8824148_1280.jpg"
            alt=""
            class="profile-img-story"
          />
          <span class="story-user-name">friend-n</span>
        </div>
        <div class="story">
          <img
            src="https://cdn.pixabay.com/photo/2022/12/10/11/05/snow-7646952_1280.jpg"
            alt=""
            class="story-img"
          />
          <img
            src="https://cdn.pixabay.com/photo/2024/06/11/21/36/cherries-8824148_1280.jpg"
            alt=""
            class="profile-img-story"
          />
          <span class="story-user-name">friend-n</span>
        </div>
      </div>
    </div>
   <div class="posts-section">
  <div class="upload-top">
    <img
      src="https://cdn.pixabay.com/photo/2024/06/11/21/36/cherries-8824148_1280.jpg"
      alt="Profile picture"
      class="upload-pfp"
    />

    <input
      type="text"
      placeholder="What's on your mind?"
      class="upload-text-area"
    />
  </div>

  <hr />

  <div class="upload-icons">
    <div class="upload-option">
      <span class="material-symbols-outlined">videocam</span>
      <span>Live</span>
    </div>

    <div class="upload-option">
      <span class="material-symbols-outlined">photo_library</span>
      <span>Photo/Video</span>
    </div>

    <div class="upload-option">
      <span class="material-symbols-outlined">mood</span>
      <span>Feeling/Activity</span>
    </div>
  </div>
</div>
</div>
</div>
  </body>
</html>
